# Colorscheme theme file — swap this entire file to change schemes.
# See docs/colorscheme.md for the token → tool mapping reference.
# Theme files live in configs/themes/ — copy one over this file to switch.

# ── Base palette (14 hues) ──
# Raw color identities used by catppuccin compat, btop graphs, and ANSI.
# All other sections derive their values from these.
[colors.palette]
coral = "f3b8b0"
salmon = "f0aaaa"
pink = "ee9dd4"
purple = "c490f0"
red = "ee668c"
red_soft = "e67c92"
orange = "f59a64"
yellow = "f0d57c"
green = "8ae28e"
teal = "6addca"
cyan = "6cd2ea"
azure = "67c0ea"
blue = "7aacf9"
lilac = "a29ffb"

# ── Core UI ──
# Backgrounds, foregrounds, borders, surfaces, accent
[colors.ui]
bg = "1E1E1E"
bg_alt = "141414"
bg_deep = "0A0A0A"
bg_catppuccin = "1e1e2e"
fg = "cdd6f4"
fg_secondary = "bac2de"
fg_muted = "a6adc8"
fg_faint = "9399b2"
border = "7f849c"
border_muted = "6c7086"
surface = "45475a"
surface_raised = "585b70"
surface_sunken = "313244"
accent = "cba6f7"
cursor = "CBD6F7"
meter_bg = "282828"
find_highlight = "3e5767"

# ── ANSI 16-color palette ──
# Terminal emulators (ghostty, etc). Normal 0-7, bright 8-15.
[colors.ansi]
black = "313244"
red = "ee668c"
green = "8ae28e"
yellow = "f0d57c"
blue = "7aacf9"
magenta = "ee9dd4"
cyan = "6addca"
white = "cdd6f4"
bright_black = "45475a"
bright_red = "e84070"
bright_green = "6de07a"
bright_yellow = "e8c84a"
bright_blue = "6aa4f8"
bright_magenta = "e878c0"
bright_cyan = "40d8c0"
bright_white = "bac2de"

# ── Syntax highlighting (treesitter-aligned) ──
[colors.syntax]
keyword = "c490f0"
type = "f0d57c"
function = "7aacf9"
property = "6addca"
variable = "cdd6f4"
string = "8ae28e"
number = "f59a64"
tag = "7aacf9"
comment = "9399b2"
operator = "6addca"
punctuation = "9399b2"
constant = "f59a64"
preproc = "f0d57c"
constructor = "c490f0"
namespace = "f0d57c"

# ── Markup / prose ──
[colors.markup]
heading_1 = "ee668c"
heading_2 = "f59a64"
heading_3 = "f0d57c"
heading_4 = "8ae28e"
heading_5 = "67c0ea"
heading_6 = "a29ffb"
bold = "ee668c"
italic = "ee668c"
strikethrough = "a6adc8"
link = "7aacf9"
raw = "8ae28e"
quote = "ee9dd4"
list_marker = "6addca"

# ── Diagnostics ──
[colors.diagnostic]
error = "ee668c"
warning = "f0d57c"
info = "7aacf9"
hint = "8ae28e"

# ── Git ──
# Starship prompt + lazygit branch colors
[colors.git]
