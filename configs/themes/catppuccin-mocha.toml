state = "f5906a"
modified = "e8c84a"
untracked = "6aa4f8"
staged = "6de07a"
stashed = "b080f0"
conflicted = "e84070"
deleted = "e84070"
ahead_behind = "6de07a"

# ── Diff (delta + nvim) ──
[colors.diff]
